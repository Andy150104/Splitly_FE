<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../../src/navbar.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: #f5f3e8;
        color: #354028;
      }
      body {
        min-height: 220vh;
        background:
          radial-gradient(circle at 50% 28%, rgba(231, 235, 157, 0.28), transparent 24%), #f5f3e8;
      }
      .mock {
        height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .mock:before {
        content: '';
        width: min(58vw, 720px);
        aspect-ratio: 1;
        border: 1px solid rgba(80, 90, 56, 0.1);
        border-radius: 50%;
        position: absolute;
        top: 23%;
        left: 50%;
        transform: translateX(-50%);
      }
      .mock h1 {
        font-size: clamp(54px, 8vw, 132px);
        letter-spacing: -0.04em;
        opacity: 0.1;
        margin: 0;
        text-align: center;
        line-height: 0.82;
      }
      button {
        font-family: inherit;
      }
      .debug-controls {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 99;
        display: flex;
        gap: 6px;
      }
      .debug-controls button {
        padding: 8px 10px;
        border: 1px solid #c9c8b9;
        background: #fff;
        border-radius: 99px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="site-header-shell">
      <header class="site-header is-scrolled is-settled is-story-mode" id="nav">
        <a class="brand" href="#">mơ<span>.</span><span class="brand-star">✳</span></a>
        <div class="nav-context" style="--nav-progress: 47%" aria-live="polite">
          <button class="nav-context-trigger" id="quickBtn" aria-expanded="false">
            <span class="nav-context-copy"
              ><span class="nav-context-eyebrow">03 — HÓA ĐƠN</span
              ><strong>BỚT ĐIỀU PHẢI NHỚ</strong></span
            ><span class="nav-context-chevron"></span>
          </button>
          <div class="nav-progress-block">
            <div class="nav-progress-track">
              <span class="nav-progress-fill"></span><span class="nav-progress-glow"></span>
            </div>
            <div class="nav-story-steps">
              <button data-label="01 · Mở ví"><span></span></button
              ><button class="is-passed" data-label="02 · Chia tiền"><span></span></button
              ><button class="is-active" data-label="03 · Hóa đơn"><span></span></button
              ><button data-label="04 · Nhìn rõ"><span></span></button
              ><button data-label="05 · Để dành"><span></span></button>
            </div>
          </div>
          <span class="nav-context-count">03 / 05</span>
        </div>
        <button class="nav-cta"><span>MỞ VÍ</span><span>↗</span></button>
        <button class="nav-collapse-toggle" id="collapseBtn" aria-label="Thu gọn thanh điều hướng">
          <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <div
          id="nav-quick-panel"
          class="nav-quick-panel"
          role="dialog"
          aria-label="Điều hướng nhanh"
          hidden
        >
          <div class="nav-quick-head">
            <span>ĐI NHANH TỚI</span><strong>Chọn một chương để tiếp tục câu chuyện</strong>
          </div>
          <div class="nav-quick-sections">
            <button class="is-active">Trang đầu</button><button>Khám phá</button
            ><button>Điều đang mơ</button><button>Câu chuyện</button>
          </div>
          <div class="nav-quick-divider"></div>
          <div class="nav-quick-chapters">
            <button><span>01</span><strong>Mở ví</strong><small>TỪ RỐI ĐẾN GỌN</small></button
            ><button>
              <span>02</span><strong>Chia tiền</strong
              ><small>CHIA TIỀN, GIỮ NIỀM VUI</small></button
            ><button class="is-active">
              <span>03</span><strong>Hóa đơn</strong><small>BỚT ĐIỀU PHẢI NHỚ</small></button
            ><button><span>04</span><strong>Nhìn rõ</strong><small>HIỂU DÒNG TIỀN</small></button
            ><button>
              <span>05</span><strong>Để dành</strong><small>DÀNH CHỖ CHO TƯƠNG LAI</small>
            </button>
          </div>
        </div>
      </header>
    </div>
    <section class="mock">
      <h1>TIỀN BẠC<br />NHẸ ĐẦU HƠN.</h1>
    </section>
    <div class="debug-controls">
      <button id="toggleQuick">Quick nav</button><button id="toggleCollapse">Collapse</button
      ><button id="toggleScroll">Scrolling</button>
    </div>
    <script>
      const nav = document.querySelector('#nav')
      const panel = document.querySelector('#nav-quick-panel')
      const quick = document.querySelector('#quickBtn')
      function setQuick(v) {
        panel.hidden = !v
        quick?.setAttribute('aria-expanded', String(v))
        nav.classList.toggle('is-quick-nav-open', v)
      }
      function setCollapsed(v) {
        nav.classList.toggle('is-collapsed', v)
        setQuick(false)
        if (v) {
          document.querySelector('.nav-context').style.display = 'none'
          document.querySelector('.nav-cta').style.display = 'none'
          if (!document.querySelector('.nav-collapsed-context')) {
            const b = document.createElement('button')
            b.className = 'nav-collapsed-context'
            b.innerHTML = '<span>03 / 05</span><strong>03 · Hóa đơn</strong>'
            nav.insertBefore(b, document.querySelector('.nav-collapse-toggle'))
            b.onclick = () => setCollapsed(false)
          }
        } else {
          document.querySelector('.nav-context').style.display = 'grid'
          document.querySelector('.nav-cta').style.display = 'inline-flex'
          document.querySelector('.nav-collapsed-context')?.remove()
        }
      }
      quick.onclick = () => setQuick(panel.hidden)
      document.querySelector('#toggleQuick').onclick = () => setQuick(panel.hidden)
      document.querySelector('#collapseBtn').onclick = () =>
        setCollapsed(!nav.classList.contains('is-collapsed'))
      document.querySelector('#toggleCollapse').onclick = () =>
        setCollapsed(!nav.classList.contains('is-collapsed'))
      document.querySelector('#toggleScroll').onclick = () => {
        nav.classList.toggle('is-scrolling')
        nav.classList.toggle('is-settled')
      }
      const mode = new URLSearchParams(location.search).get('mode')
      if (mode === 'open') setQuick(true)
      if (mode === 'collapsed') setCollapsed(true)
      if (mode === 'scrolling') {
        nav.classList.add('is-scrolling')
        nav.classList.remove('is-settled')
      }
    </script>
  </body>
</html>
